<!doctype html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Azot</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="polish.css"><script defer src="polish.js"></script></head><body>
<aside id="sidebar" class="sidebar"><div class="sidebar-top"><div class="brand"><img src="../../azot%20logo.png" alt="Azot"><strong>Azot</strong></div><div class="window-controls"><button id="close" data-tooltip="Fermer">×</button><button id="min" data-tooltip="Réduire">−</button><button id="max" data-tooltip="Agrandir">□</button></div><button class="icon pin" id="pin" data-tooltip="Escamoter"><svg><use href="#i-menu"/></svg></button></div><button class="omnibox-trigger" id="openPalette"><svg><use href="#i-search"/></svg><span class="label">Rechercher ou naviguer</span><kbd>⌘L</kbd></button><div class="tool-row"><button class="icon" id="back" data-tooltip="Précédent"><svg><use href="#i-back"/></svg></button><button class="icon" id="forward" data-tooltip="Suivant"><svg><use href="#i-forward"/></svg></button><button class="icon" id="reload" data-tooltip="Recharger"><svg><use href="#i-reload"/></svg></button><span class="tool-spacer"></span><button class="icon shield" id="shield" data-tooltip="Azot Shield"><svg><use href="#i-shield"/></svg><small id="blocked">0</small></button><button class="icon" id="guard" data-tooltip="Azot Guard"><svg><use href="#i-guard"/></svg></button></div><div class="tab-section"><div class="tabs" id="tabs"><i id="activePill"></i></div><button class="new-tab" id="newTab"><span>+</span><b>Nouvel onglet</b><kbd>⌘T</kbd></button></div><div class="bottom-tools"><button class="icon" id="history" data-tooltip="Historique"><svg><use href="#i-history"/></svg></button><button class="icon" id="extensions" data-tooltip="Extensions"><svg><use href="#i-extension"/></svg></button><button class="icon" id="themes" data-tooltip="Thèmes"><svg><use href="#i-theme"/></svg></button><button class="icon" id="settings" data-tooltip="Paramètres"><svg><use href="#i-settings"/></svg></button></div></aside>
<svg class="defs"><symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></symbol><symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6"/><path d="m16 16 4 4"/></symbol><symbol id="i-back" viewBox="0 0 24 24"><path d="m14 6-6 6 6 6"/></symbol><symbol id="i-forward" viewBox="0 0 24 24"><path d="m10 6 6 6-6 6"/></symbol><symbol id="i-reload" viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0 2 5M20 4v7h-7"/></symbol><symbol id="i-shield" viewBox="0 0 24 24"><path d="M12 3 20 6v5c0 5-3.4 8.5-8 10-4.6-1.5-8-5-8-10V6zM9 12l2 2 4-4"/></symbol><symbol id="i-guard" viewBox="0 0 24 24"><path d="M12 3 20 6v5c0 5-3.4 8.5-8 10-4.6-1.5-8-5-8-10V6zM12 8v4M12 16h.01"/></symbol><symbol id="i-history" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7M3 4v5h5M12 7v5l3 2"/></symbol><symbol id="i-extension" viewBox="0 0 24 24"><path d="M19 13h-3v3a3 3 0 1 1-6 0v-3H7v-3a3 3 0 1 0 0-6h3V2h6v2h3a3 3 0 1 1 0 6z"/></symbol><symbol id="i-theme" viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 0 18h1a2 2 0 0 0 0-4h-1a2 2 0 0 1 0-4h2a4 4 0 0 0 4-4 6 6 0 0 0-6-6ZM7.5 10h.01M9 6.5h.01M15.5 7.5h.01"/></symbol><symbol id="i-settings" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19 12h2M3 12h2M12 3v2M12 19v2M17 7l2-2M5 19l2-2M17 17l2 2M5 5l2 2"/></symbol></svg>
<div id="progress" class="progress"></div><div id="scrim" class="scrim"></div><section id="palette" class="palette"><form id="omniboxForm"><svg><use href="#i-search"/></svg><input id="omnibox" autocomplete="off" spellcheck="false" placeholder="Rechercher, URL ou commande…"><kbd>Entrée</kbd></form><div class="palette-hint">« historique », « paramètres » ou « extensions » · Échap pour fermer</div></section>
<aside id="studio" class="panel"><div class="panel-head"><h2>Theme Studio</h2><button class="icon closePanel">×</button></div><label>Preset <select id="preset"></select></label><label>Fond <input type="color" data-key="bg"></label><label>Accent <input type="color" data-key="accent"></label><label>Texte <input type="color" data-key="text"></label><label>Opacité <input type="range" min="0.35" max="0.95" step=".05" data-key="opacity"></label><label>Flou <input type="range" min="0" max="32" data-key="blur"></label><label>Arrondis <input type="range" min="4" max="20" data-key="radius"></label><div class="panel-actions"><button id="saveTheme">Sauvegarder</button><button id="exportTheme">Exporter</button><label class="button">Importer<input id="importTheme" type="file" hidden></label></div></aside>
<aside id="historyPanel" class="panel wide"><div class="panel-head"><h2>Historique</h2><button class="icon closePanel">×</button></div><input id="historySearch" class="panel-search" placeholder="Rechercher dans l’historique"><div id="historyList"></div><button id="clearHistory" class="danger">Effacer l’historique</button></aside><aside id="settingsPanel" class="panel wide"><div class="panel-head"><h2>Paramètres</h2><button class="icon closePanel">×</button></div><div id="settingsForm"></div></aside><aside id="extensionPanel" class="panel wide"><div class="panel-head"><h2>Extensions</h2><button class="icon closePanel">×</button></div><div id="extensionList"></div><button id="addExtension">Charger une extension décompressée</button></aside><script src="renderer.js"></script></body></html>
